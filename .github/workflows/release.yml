name: Release

on:
  workflow_run:
    workflows: ["Build Android", "Build Desktop"]
    types: [completed]

jobs:
  release:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'v')
    runs-on: ubuntu-latest
    steps:
      # Both build workflows fire on the same tag push, but this job only
      # runs once each completes -- wait for the sibling before publishing,
      # so a release isn't cut with only half the platforms attached.
      - name: Wait for the other build workflow
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.payload.workflow_run.head_branch;
            const names = ["Build Android", "Build Desktop"];
            for (let i = 0; i < 30; i++) {
              const runs = await Promise.all(names.map(name =>
                github.rest.actions.listWorkflowRuns({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id: `${name.toLowerCase().replace(" ", "-")}.yml`,
                  branch: tag,
                }).then(r => r.data.workflow_runs[0])
              ));
              if (runs.every(r => r && r.status === "completed")) {
                if (runs.some(r => r.conclusion !== "success")) core.setFailed("A sibling build workflow did not succeed.");
                return;
              }
              await new Promise(r => setTimeout(r, 30000));
            }
            core.setFailed("Timed out waiting for the sibling build workflow.");

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          pattern: "*"

      - name: Also grab the sibling workflow's artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.payload.workflow_run.head_branch;
            const other = context.payload.workflow_run.name === "Build Android" ? "Build Desktop" : "Build Android";
            const runs = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              branch: tag, event: "push",
            });
            const run = runs.data.workflow_runs.find(r => r.name === other && r.head_branch === tag);
            core.setOutput("run_id", run ? run.id : "");
          id: sibling

      - name: Download sibling artifacts
        if: steps.sibling.outputs.run_id != ''
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.sibling.outputs.run_id }}
          pattern: "*"

      - name: Flatten
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          ls -la release

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.workflow_run.head_branch }}
          files: release/*
          fail_on_unmatched_files: true
          generate_release_notes: true
