name: Build Android

on:
  workflow_dispatch:
  push:            # no filters = every branch and every tag
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: "27.0.12077973"
  BUILD_TOOLS_VERSION: "34.0.0"

jobs:
  android:
    name: Android (${{ matrix.presence }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        presence: [oauth, token]
    env:
      PRESENCE_FEATURE: ${{ matrix.presence == 'token' && 'mobile-presence-token' || 'mobile-presence-oauth' }}
      # Keystore is committed to the repo (hobby project, security not a concern).
      KEYSTORE_PASS: khiplayer
      KEY_ALIAS: khiplayer

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK (cmdline-tools + licenses)
        uses: android-actions/setup-android@v3
        with:
          # Default is "tools platform-tools"; the legacy "tools" package no longer
          # exists, so sdkmanager exits 1. We install what we need in the next step.
          packages: ""

      - name: Install SDK platform, build-tools, NDK
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;${{ env.BUILD_TOOLS_VERSION }}" \
            "ndk;${{ env.NDK_VERSION }}"
          echo "NDK_HOME=$ANDROID_HOME/ndk/${{ env.NDK_VERSION }}" >> "$GITHUB_ENV"

      - name: Set up Rust (all four Android ABIs)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: >-
            aarch64-linux-android,
            armv7-linux-androideabi,
            i686-linux-android,
            x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Generate Android project
        run: cargo tauri android init --ci

      - name: Patch native Android sources
        run: |
          chmod +x scripts/patch-android.sh
          ./scripts/patch-android.sh

      - name: Build release APKs (aarch64, armv7, i686, x86_64)
        run: |
          cargo tauri android build --apk \
            --target aarch64 --target armv7 --target i686 --target x86_64 \
            --ci \
            -- --no-default-features --features "$PRESENCE_FEATURE"

      - name: Sign APKs
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/${{ env.BUILD_TOOLS_VERSION }}"
          # Find the committed keystore wherever it lives in the repo.
          KEYSTORE_FILE="$(find "$GITHUB_WORKSPACE" -type f \( -name '*.keystore' -o -name '*.jks' \) -not -path '*/node_modules/*' | head -n1)"
          if [ -z "$KEYSTORE_FILE" ]; then
            echo "::error::No .keystore/.jks file found in the checkout. Files at repo root:"
            ls -la "$GITHUB_WORKSPACE"
            exit 1
          fi
          echo "Using keystore: $KEYSTORE_FILE"
          mkdir -p dist
          find src-tauri/gen/android -name '*-unsigned.apk' -print0 | while IFS= read -r -d '' apk; do
            base="$(basename "${apk%-unsigned.apk}")"
            aligned="$RUNNER_TEMP/${base}-aligned.apk"
            "$BT/zipalign" -f -p 4 "$apk" "$aligned"
            "$BT/apksigner" sign \
              --ks "$KEYSTORE_FILE" \
              --ks-pass "pass:$KEYSTORE_PASS" \
              --ks-key-alias "$KEY_ALIAS" \
              --key-pass "pass:$KEYSTORE_PASS" \
              --out "dist/khiplayer-${{ matrix.presence }}-${base}.apk" \
              "$aligned"
          done
          ls -la dist
          [ -n "$(ls dist/*.apk 2>/dev/null)" ] || { echo "::error::No unsigned APKs found to sign"; exit 1; }

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.presence }}
          path: dist/*.apk
          if-no-files-found: error
