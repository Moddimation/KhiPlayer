name: Build Android

on:
  workflow_dispatch:
  push:            # no filters = every branch and every tag
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: "27.0.12077973"
  BUILD_TOOLS_VERSION: "34.0.0"

jobs:
  android:
    name: Android (${{ matrix.presence }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        presence: [oauth, token]
    env:
      PRESENCE_FEATURE: ${{ matrix.presence == 'token' && 'mobile-presence-token' || 'mobile-presence-oauth' }}
      HAS_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK (cmdline-tools + licenses)
        uses: android-actions/setup-android@v3

      - name: Install SDK platform, build-tools, NDK
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;${{ env.BUILD_TOOLS_VERSION }}" \
            "ndk;${{ env.NDK_VERSION }}"
          echo "NDK_HOME=$ANDROID_HOME/ndk/${{ env.NDK_VERSION }}" >> "$GITHUB_ENV"

      - name: Set up Rust (all four Android ABIs)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: >-
            aarch64-linux-android,
            armv7-linux-androideabi,
            i686-linux-android,
            x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Generate Android project
        run: cargo tauri android init --ci

      - name: Build release APKs (aarch64, armv7, i686, x86_64)
        run: |
          cargo tauri android build --apk \
            --target aarch64 --target armv7 --target i686 --target x86_64 \
            --ci \
            -- --no-default-features --features "$PRESENCE_FEATURE"

      - name: Sign APKs
        if: env.HAS_SIGNING == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          BT="$ANDROID_HOME/build-tools/${{ env.BUILD_TOOLS_VERSION }}"
          mkdir -p dist
          find src-tauri/gen/android -name '*-unsigned.apk' -print0 | while IFS= read -r -d '' apk; do
            base="$(basename "${apk%-unsigned.apk}")"
            aligned="$RUNNER_TEMP/${base}-aligned.apk"
            "$BT/zipalign" -f -p 4 "$apk" "$aligned"
            "$BT/apksigner" sign \
              --ks "$RUNNER_TEMP/release.keystore" \
              --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" \
              --ks-key-alias "$ANDROID_KEY_ALIAS" \
              --key-pass "pass:$ANDROID_KEY_PASSWORD" \
              --out "dist/khiplayer-${{ matrix.presence }}-${base}.apk" \
              "$aligned"
          done
          rm -f "$RUNNER_TEMP/release.keystore"

      - name: Collect unsigned APKs (no ANDROID_KEYSTORE_BASE64 secret configured)
        if: env.HAS_SIGNING != 'true'
        run: |
          mkdir -p dist
          find src-tauri/gen/android -name '*.apk' -exec sh -c 'cp "$1" "dist/khiplayer-${{ matrix.presence }}-$(basename "$1")"' _ {} \;
          echo "::warning::No signing secrets configured -- these APKs are unsigned and cannot be installed as-is. See README for ANDROID_KEYSTORE_BASE64 setup."

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ matrix.presence }}
          path: dist/*.apk
          if-no-files-found: error
