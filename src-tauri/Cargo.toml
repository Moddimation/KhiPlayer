[package]
name = "khinsider-app"
version = "0.1.0"
description = "Unofficial desktop wrapper for khinsider with Discord Rich Presence"
edition = "2021"

[lib]
# main.rs calls khinsider_app_lib::run()
name = "khinsider_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
discord-rich-presence = "1"

[profile.release]
# Speed over size: full optimisation, whole-program LTO, single codegen unit.
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
