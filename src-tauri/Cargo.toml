[package]
name = "khinsider-app"
version = "0.1.0"
description = "Unofficial desktop wrapper for khinsider with Discord Rich Presence"
edition = "2021"

[lib]
# main.rs calls khinsider_app_lib::run()
name = "khinsider_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["mobile-presence-oauth"]              # sanctioned path: OAuth2 + Headless Sessions API
mobile-presence-oauth = []                       # explicit name for the default, so --token can disable it
mobile-presence-token = ["dep:tokio-tungstenite"] # opt-in: self-bot Gateway path

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
discord-rich-presence = "1"

# ---- mobile-only: OAuth2 (PKCE) + Discord Headless Sessions API ----
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-media-session = "0.2"   # background playback: foreground service + lockscreen/notification controls
tokio = { version = "1", features = ["sync", "rt", "time", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }  # rustls = no OpenSSL (breaks Android cross-builds)
url = "2"
urlencoding = "2"
rand = "0.8"                                           # PKCE code_verifier generation
sha2 = "0.10"                                          # PKCE code_challenge (S256)
base64 = "0.22"
tokio-tungstenite = { version = "0.24", optional = true, default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }  # gateway_presence.rs: --token path only

[profile.release]
# Speed over size: full optimisation, whole-program LTO, single codegen unit.
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
